name: CI

# Solo comprueba que el proyecto funciona. El despliegue lo hace Cloudflare Pages
# al detectar cada cambio en `main` (ver README).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
