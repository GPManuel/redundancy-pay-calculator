<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Indemnización por Despido</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .campo { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #218838; }
    #resultado { margin-top: 20px; font-size: 18px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Calculadora de Indemnización</h2>

  <div class="campo">
    <label for="salario">Salario Bruto Anual (€):</label>
    <input type="number" id="salario" placeholder="Ej: 24000">
  </div>

  <div class="campo">
    <label for="fechaInicio">Fecha de Inicio de Contrato:</label>
    <input type="date" id="fechaInicio">
  </div>

  <div class="campo">
    <label for="fechaFin">Fecha de Fin de Contrato:</label>
    <input type="date" id="fechaFin">
  </div>

  <div class="campo">
    <label for="tipoDespido">Tipo de Despido:</label>
    <select id="tipoDespido">
      <option value="objetivo">Objetivo / Procedente (20 días/año)</option>
      <option value="improcedente">Improcedente (33 días/año)</option>
    </select>
  </div>

  <button onclick="calcularIndemnizacion()">Calcular</button>

  <div id="resultado"></div>

  <script>
    function calcularIndemnizacion() {
      const salarioAnual = parseFloat(document.getElementById('salario').value);
      const inicio = new Date(document.getElementById('fechaInicio').value);
      const fin = new Date(document.getElementById('fechaFin').value);
      const tipo = document.getElementById('tipoDespido').value;

      if (!salarioAnual || isNaN(inicio) || isNaN(fin) || fin <= inicio) {
        document.getElementById('resultado').innerText = 'Ingresa fechas y salario válidos.';
        return;
      }

      // Cálculo de meses completos trabajados (los días sueltos computan como mes)
      let meses = (fin.getFullYear() - inicio.getFullYear()) * 12 + (fin.getMonth() - inicio.getMonth());
      if (fin.getDate() >= inicio.getDate()) {
        meses += 1;
      }

      const salarioDiario = salarioAnual / 365;
      const salarioMensual = salarioAnual / 12;

      const diasPorAno = tipo === 'objetivo' ? 20 : 33;
      const topeMensualidades = tipo === 'objetivo' ? 12 : 24;

      // Indemnización estimada sin tope
      let indemnizacion = salarioDiario * (diasPorAno / 12) * meses;

      // Aplicar el tope legal
      const topeMaximo = salarioMensual * topeMensualidades;
      if (indemnizacion > topeMaximo) {
        indemnizacion = topeMaximo;
      }

      document.getElementById('resultado').innerText = `Indemnización estimada: ${indemnizacion.toFixed(2)} €`;
    }
  </script>
</body>
</html>
